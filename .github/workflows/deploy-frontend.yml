# Builds the React frontend and deploys it to the Azure Static Web App
# (https://polite-plant-04bf1e000.3.azurestaticapps.net) on every push to
# pwa-setup. Only the frontend is deployed here; the backend (App Service)
# is deployed separately.
#
# Needs the repo secret AZURE_STATIC_WEB_APPS_API_TOKEN
# (GitHub -> Settings -> Secrets and variables -> Actions).

name: Deploy frontend to Azure

on:
  push:
    branches:
      - pwa-setup
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: /
          api_location: ""
          output_location: build
        env:
          # CI=true would turn every ESLint warning into a build failure.
          CI: false
          GENERATE_SOURCEMAP: false
          REACT_APP_API_BASE: https://safeconnect-api-fhtsa.azurewebsites.net/api
          REACT_APP_ASSET_BASE: https://safeconnect-api-fhtsa.azurewebsites.net
